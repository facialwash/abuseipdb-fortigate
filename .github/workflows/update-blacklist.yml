
name: Update AbuseIPDB Blacklist

on:
  schedule:
    - cron: "0 18 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-blacklist:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run Python Script
        run: python3 scripts/update_blacklist.py
        env:
          ABUSEIPDB_API_KEY: ${{ secrets.ABUSEIPDB_API_KEY }}

      - name: Commit Updated Blacklist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add blacklist.txt

          if git diff --cached --quiet; then
            echo "No blacklist changes detected"
          else
            git commit -m "Daily AbuseIPDB blacklist update"
            git push
          fi
